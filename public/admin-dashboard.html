<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Dr. Mohammed Al Amin</title>
  <style>
    :root {
      --bg: #07080b;
      --bg-2: #0a0c11;
      --panel: #0d1016;
      --panel-2: #11151d;
      --line: rgba(255, 255, 255, 0.075);
      --line-2: rgba(255, 255, 255, 0.14);
      --text: #ece9e3;
      --text-2: #b9bdc6;
      --muted: #8b919d;
      --amber: #f5c256;
      --amber-2: #ffd982;
      --amber-deep: #c2851a;
      --ok: #3ddc97;
      --danger: #ff6b6b;
      --radius: 16px;
      --radius-sm: 10px;
      --sans: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, "Noto Sans Arabic", "Segoe UI Historic", Tahoma, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      min-height: 100vh;
      color: var(--text);
    }

    .header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .header .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header .username {
      font-size: 14px;
      color: var(--text-2);
    }

    .header .settings-link {
      color: var(--amber);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.25s var(--ease);
    }

    .header .settings-link:hover {
      color: var(--amber-2);
    }

    .header .logout-btn {
      background: rgba(255, 107, 107, 0.1);
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.3);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      font-family: var(--sans);
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .header .logout-btn:hover {
      background: rgba(255, 107, 107, 0.2);
      border-color: var(--danger);
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--amber-deep), var(--amber-2), var(--amber));
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(100deg, var(--amber-2), var(--amber) 45%, var(--amber-deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat-card .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0;
    }

    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: var(--sans);
      transition: color 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .tab.active {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }

    .tab:hover {
      color: var(--amber);
    }

    .content {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
    }

    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters input,
    .filters select {
      padding: 10px 14px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text);
      font-family: var(--sans);
      transition: border-color 0.25s var(--ease);
    }

    .filters input:focus,
    .filters select:focus {
      outline: none;
      border-color: var(--amber);
    }

    .filters input::placeholder {
      color: var(--muted);
    }

    .filters button {
      padding: 10px 16px;
      background: linear-gradient(100deg, var(--amber-2), var(--amber) 45%, var(--amber-deep));
      color: var(--bg);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--sans);
      transition: transform 0.2s var(--ease), box-shadow 0.25s var(--ease);
    }

    .filters button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(245, 194, 86, 0.3);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    .table th {
      font-weight: 600;
      color: var(--text-2);
      font-size: 14px;
    }

    .table td {
      font-size: 14px;
      color: var(--text);
    }

    .table tr:hover {
      background: var(--panel-2);
    }

    .status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .status.confirmed {
      background: rgba(61, 220, 151, 0.1);
      color: var(--ok);
      border: 1px solid rgba(61, 220, 151, 0.3);
    }

    .status.cancelled {
      background: rgba(255, 107, 107, 0.1);
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.3);
    }

    .action-btn {
      padding: 6px 12px;
      background: rgba(245, 194, 86, 0.1);
      color: var(--amber);
      border: 1px solid rgba(245, 194, 86, 0.3);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
      font-family: var(--sans);
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .action-btn:hover {
      background: rgba(245, 194, 86, 0.2);
      border-color: var(--amber);
    }

    .action-btn.danger {
      background: rgba(255, 107, 107, 0.1);
      color: var(--danger);
      border-color: rgba(255, 107, 107, 0.3);
    }

    .action-btn.danger:hover {
      background: rgba(255, 107, 107, 0.2);
      border-color: var(--danger);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: var(--danger);
      padding: 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 8px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text);
      font-family: var(--sans);
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .pagination button:hover {
      background: var(--panel-2);
      border-color: var(--line-2);
    }

    .pagination button.active {
      background: linear-gradient(100deg, var(--amber-2), var(--amber) 45%, var(--amber-deep));
      color: var(--bg);
      border-color: transparent;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      width: 90%;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .modal-header h2 {
      font-size: 20px;
      color: var(--text);
      font-weight: 650;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.25s var(--ease);
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      font-size: 14px;
      color: var(--text);
    }

    .modal-body .field {
      margin-bottom: 15px;
    }

    .modal-body .label {
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
    }

    .modal-body .value {
      color: var(--text);
    }

    .modal-body .value a {
      color: var(--amber);
    }

    .modal-body .answers {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .modal-body .answers h3 {
      font-size: 16px;
      color: var(--amber);
      margin-bottom: 15px;
    }

    .modal-body .answer {
      margin-bottom: 15px;
    }

    .modal-body .answer-question {
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
    }

    .modal-body .answer-values {
      color: var(--text);
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .header .user-info {
        width: 100%;
        justify-content: space-between;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .filters {
        flex-direction: column;
      }

      .filters input,
      .filters select,
      .filters button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Admin Dashboard</h1>
    <div class="user-info">
      <span class="username" id="username">Loading...</span>
      <a href="/admin/settings" class="settings-link">Settings</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <h3>Total Bookings</h3>
        <div class="value" id="totalBookings">-</div>
        <div class="sub" id="bookingRevenue">Revenue: $0</div>
      </div>
      <div class="stat-card">
        <h3>Collaborations</h3>
        <div class="value" id="totalCollabs">-</div>
        <div class="sub">Requests received</div>
      </div>
      <div class="stat-card">
        <h3>Questionnaires</h3>
        <div class="value" id="totalQuestionnaires">-</div>
        <div class="sub">Submissions</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="bookings">Bookings</button>
      <button class="tab" data-tab="collaborations">Collaborations</button>
      <button class="tab" data-tab="questionnaires">Questionnaires</button>
    </div>

    <div class="content">
      <div class="error" id="error"></div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search...">
        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button id="refreshBtn">Refresh</button>
        <button id="exportBtn">Export CSV</button>
      </div>

      <div id="tableContainer">
        <div class="loading">Loading...</div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Details</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    let currentTab = 'bookings';
    let currentPage = 0;
    const perPage = 20;

    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/stats');
        if (!response.ok) {
          window.location.href = '/admin/login';
          return false;
        }
        return true;
      } catch (err) {
        window.location.href = '/admin/login';
        return false;
      }
    }

    // Load stats
    async function loadStats() {
      try {
        const response = await fetch('/api/admin/stats');
        const data = await response.json();

        document.getElementById('totalBookings').textContent = data.bookings.total || 0;
        document.getElementById('bookingRevenue').textContent = `Revenue: $${(data.bookings.total_revenue || 0).toFixed(2)}`;
        document.getElementById('totalCollabs').textContent = data.collaborations || 0;
        document.getElementById('totalQuestionnaires').textContent = data.questionnaires || 0;
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    // Load data based on current tab
    async function loadData() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div class="loading">Loading...</div>';

      try {
        let endpoint = '';
        if (currentTab === 'bookings') endpoint = '/api/admin/bookings';
        else if (currentTab === 'collaborations') endpoint = '/api/admin/collaborations';
        else if (currentTab === 'questionnaires') endpoint = '/api/admin/questionnaires';

        const search = document.getElementById('searchInput').value;
        const status = document.getElementById('statusFilter').value;

        const url = `${endpoint}?limit=${perPage}&offset=${currentPage * perPage}&search=${encodeURIComponent(search)}&status=${encodeURIComponent(status)}`;

        const response = await fetch(url);
        const data = await response.json();

        renderTable(data);
      } catch (err) {
        container.innerHTML = '<div class="error show">Failed to load data</div>';
      }
    }

    // Render table
    function renderTable(data) {
      const container = document.getElementById('tableContainer');
      const items = data[currentTab] || [];

      if (items.length === 0) {
        container.innerHTML = '<div class="empty">No records found</div>';
        return;
      }

      let html = '<table class="table"><thead><tr>';

      if (currentTab === 'bookings') {
        html += '<th>Ref</th><th>Date</th><th>Time</th><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Actions</th>';
      } else if (currentTab === 'collaborations') {
        html += '<th>Ref</th><th>Name</th><th>Email</th><th>Org</th><th>Kind</th><th>Created</th><th>Actions</th>';
      } else if (currentTab === 'questionnaires') {
        html += '<th>Ref</th><th>Name</th><th>Email</th><th>Company</th><th>Role</th><th>Booked</th><th>Created</th><th>Actions</th>';
      }

      html += '</tr></thead><tbody>';

      items.forEach(item => {
        html += '<tr>';

        if (currentTab === 'bookings') {
          html += `<td>${item.ref}</td>`;
          html += `<td>${item.date}</td>`;
          html += `<td>${item.time}</td>`;
          html += `<td>${item.name}</td>`;
          html += `<td>${item.email}</td>`;
          html += `<td>${item.type}</td>`;
          html += `<td><span class="status ${item.status}">${item.status}</span></td>`;
          html += `<td>
            <button class="action-btn" onclick="viewBooking('${item.ref}')">View</button>
            ${item.status === 'confirmed' ? `<button class="action-btn danger" onclick="cancelBooking('${item.ref}')">Cancel</button>` : ''}
          </td>`;
        } else if (currentTab === 'collaborations') {
          html += `<td>${item.ref}</td>`;
          html += `<td>${item.name}</td>`;
          html += `<td>${item.email}</td>`;
          html += `<td>${item.org || 'N/A'}</td>`;
          html += `<td>${item.kind || 'N/A'}</td>`;
          html += `<td>${new Date(item.created_at).toLocaleDateString()}</td>`;
          html += `<td><button class="action-btn" onclick="viewCollaboration('${item.ref}')">View</button></td>`;
        } else if (currentTab === 'questionnaires') {
          html += `<td>${item.ref}</td>`;
          html += `<td>${item.first_name} ${item.last_name}</td>`;
          html += `<td>${item.email}</td>`;
          html += `<td>${item.company}</td>`;
          html += `<td>${item.role}</td>`;
          html += `<td>${item.booked ? 'Yes' : 'No'}</td>`;
          html += `<td>${new Date(item.created_at).toLocaleDateString()}</td>`;
          html += `<td><button class="action-btn" onclick="viewQuestionnaire('${item.ref}')">View</button></td>`;
        }

        html += '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // View booking details
    async function viewBooking(ref) {
      try {
        const response = await fetch(`/api/admin/bookings/${ref}`);
        const data = await response.json();

        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = `Booking ${data.booking.ref}`;

        let html = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${data.booking.name}</div>
          </div>
          <div class="field">
            <div class="label">Email</div>
            <div class="value">${data.booking.email}</div>
          </div>
          <div class="field">
            <div class="label">Organization</div>
            <div class="value">${data.booking.org || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Date & Time</div>
            <div class="value">${data.booking.date} at ${data.booking.time} (${data.booking.timezone})</div>
          </div>
          <div class="field">
            <div class="label">Session</div>
            <div class="value">${data.booking.sessionName} (${data.booking.duration} min)</div>
          </div>
          <div class="field">
            <div class="label">Price</div>
            <div class="value">$${data.booking.price} USD</div>
          </div>
          <div class="field">
            <div class="label">Status</div>
            <div class="value">${data.booking.status}</div>
          </div>
          <div class="field">
            <div class="label">Notes</div>
            <div class="value">${data.booking.notes || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Created</div>
            <div class="value">${new Date(data.booking.created_at).toLocaleString()}</div>
          </div>
        `;

        if (data.questionnaire) {
          html += `
            <div class="answers">
              <div class="field">
                <div class="label">Linked Questionnaire</div>
                <div class="value">${data.questionnaire.ref}</div>
              </div>
              <div class="field">
                <div class="label">Name</div>
                <div class="value">${data.questionnaire.first_name} ${data.questionnaire.last_name}</div>
              </div>
              <div class="field">
                <div class="label">Company</div>
                <div class="value">${data.questionnaire.company}</div>
              </div>
            </div>
          `;
        }

        modalBody.innerHTML = html;
        modal.classList.add('show');
      } catch (err) {
        alert('Failed to load booking details');
      }
    }

    // Cancel booking
    async function cancelBooking(ref) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;

      try {
        const response = await fetch(`/api/admin/bookings/${ref}/cancel`, { method: 'POST' });
        if (response.ok) {
          loadData();
          loadStats();
        } else {
          alert('Failed to cancel booking');
        }
      } catch (err) {
        alert('Failed to cancel booking');
      }
    }

    // View collaboration details
    async function viewCollaboration(ref) {
      try {
        const response = await fetch(`/api/admin/collaborations/${ref}`);
        const data = await response.json();

        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = `Collaboration ${data.collaboration.ref}`;

        modalBody.innerHTML = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${data.collaboration.name}</div>
          </div>
          <div class="field">
            <div class="label">Email</div>
            <div class="value">${data.collaboration.email}</div>
          </div>
          <div class="field">
            <div class="label">Organization</div>
            <div class="value">${data.collaboration.org || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Kind</div>
            <div class="value">${data.collaboration.kind || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Link</div>
            <div class="value">${data.collaboration.link ? `<a href="${data.collaboration.link}" target="_blank">${data.collaboration.link}</a>` : 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Message</div>
            <div class="value">${data.collaboration.message || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Created</div>
            <div class="value">${new Date(data.collaboration.created_at).toLocaleString()}</div>
          </div>
        `;

        modal.classList.add('show');
      } catch (err) {
        alert('Failed to load collaboration details');
      }
    }

    // View questionnaire details
    async function viewQuestionnaire(ref) {
      try {
        const response = await fetch(`/api/admin/questionnaires/${ref}`);
        const data = await response.json();

        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = `Questionnaire ${data.questionnaire.ref}`;

        let html = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${data.questionnaire.first_name} ${data.questionnaire.last_name}</div>
          </div>
          <div class="field">
            <div class="label">Email</div>
            <div class="value">${data.questionnaire.email}</div>
          </div>
          <div class="field">
            <div class="label">Phone</div>
            <div class="value">${data.questionnaire.phone}</div>
          </div>
          <div class="field">
            <div class="label">Company</div>
            <div class="value">${data.questionnaire.company}</div>
          </div>
          <div class="field">
            <div class="label">Role</div>
            <div class="value">${data.questionnaire.role}</div>
          </div>
          <div class="field">
            <div class="label">About</div>
            <div class="value">${data.questionnaire.about || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Booked</div>
            <div class="value">${data.questionnaire.booked ? `Yes (${data.questionnaire.booking_ref})` : 'No'}</div>
          </div>
          <div class="field">
            <div class="label">Created</div>
            <div class="value">${new Date(data.questionnaire.created_at).toLocaleString()}</div>
          </div>
        `;

        if (data.answers && data.answers.length > 0) {
          html += '<div class="answers"><h3>Answers</h3>';
          data.answers.forEach(answer => {
            html += `
              <div class="answer">
                <div class="answer-question">${answer.question_text}</div>
                <div class="answer-values">${JSON.parse(answer.answer_values).join(', ')}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        modalBody.innerHTML = html;
        modal.classList.add('show');
      } catch (err) {
        alert('Failed to load questionnaire details');
      }
    }

    // Export CSV
    async function exportCSV() {
      try {
        let endpoint = '';
        let filename = '';

        if (currentTab === 'bookings') {
          endpoint = '/api/admin/bookings';
          filename = 'bookings.csv';
        } else if (currentTab === 'collaborations') {
          endpoint = '/api/admin/collaborations';
          filename = 'collaborations.csv';
        } else if (currentTab === 'questionnaires') {
          endpoint = '/api/admin/questionnaires';
          filename = 'questionnaires.csv';
        }

        const response = await fetch(endpoint);
        const data = await response.json();
        const items = data[currentTab] || [];

        if (items.length === 0) {
          alert('No data to export');
          return;
        }

        let csv = '';

        if (currentTab === 'bookings') {
          csv = 'Ref,Date,Time,Name,Email,Organization,Type,Duration,Price,Status,Created\n';
          items.forEach(item => {
            csv += `"${item.ref}","${item.date}","${item.time}","${item.name}","${item.email}","${item.org || ''}","${item.type}","${item.duration}","${item.price}","${item.status}","${item.created_at}"\n`;
          });
        } else if (currentTab === 'collaborations') {
          csv = 'Ref,Name,Email,Organization,Kind,Link,Created\n';
          items.forEach(item => {
            csv += `"${item.ref}","${item.name}","${item.email}","${item.org || ''}","${item.kind || ''}","${item.link || ''}","${item.created_at}"\n`;
          });
        } else if (currentTab === 'questionnaires') {
          csv = 'Ref,First Name,Last Name,Email,Phone,Company,Role,Booked,Booking Ref,Created\n';
          items.forEach(item => {
            csv += `"${item.ref}","${item.first_name}","${item.last_name}","${item.email}","${item.phone}","${item.company}","${item.role}","${item.booked}","${item.booking_ref || ''}","${item.created_at}"\n`;
          });
        }

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert('Failed to export CSV');
      }
    }

    // Logout
    async function logout() {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        window.location.href = '/admin/login';
      } catch (err) {
        window.location.href = '/admin/login';
      }
    }

    // Event listeners
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        currentPage = 0;
        loadData();
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // Modal close
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('show');
    });

    // Close modal on outside click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        document.getElementById('modal').classList.remove('show');
      }
    });

    // Initialize
    checkAuth().then(authenticated => {
      if (authenticated) {
        loadStats();
        loadData();
      }
    });
  </script>
</body>
</html>
