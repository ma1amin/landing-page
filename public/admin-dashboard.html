<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Dr. Mohammed Al Amin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    
    .header {
      background: #1a1a2e;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 24px;
    }
    
    .header .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .header .username {
      font-size: 14px;
    }
    
    .header .settings-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }
    
    .header .settings-link:hover {
      text-decoration: underline;
    }
    
    .header .logout-btn {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .header .logout-btn:hover {
      background: #357abd;
    }
    
    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .stat-card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .stat-card .value {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a2e;
    }
    
    .stat-card .sub {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    
    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    
    .tab.active {
      color: #4a90e2;
      border-bottom-color: #4a90e2;
    }
    
    .tab:hover {
      color: #4a90e2;
    }
    
    .content {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }
    
    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .filters input,
    .filters select {
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .filters button {
      padding: 8px 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .table th,
    .table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .table th {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    
    .table td {
      font-size: 14px;
      color: #666;
    }
    
    .table tr:hover {
      background: #f9f9f9;
    }
    
    .status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status.confirmed {
      background: #e8f5e9;
      color: #2e7d32;
    }
    
    .status.cancelled {
      background: #ffebee;
      color: #c62828;
    }
    
    .action-btn {
      padding: 6px 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
    }
    
    .action-btn:hover {
      background: #357abd;
    }
    
    .action-btn.danger {
      background: #c62828;
    }
    
    .action-btn.danger:hover {
      background: #b71c1c;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .pagination button {
      padding: 8px 16px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
    }
    
    .pagination button:hover {
      background: #f9f9f9;
    }
    
    .pagination button.active {
      background: #4a90e2;
      color: white;
      border-color: #4a90e2;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      width: 90%;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .modal-header h2 {
      font-size: 20px;
      color: #1a1a2e;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }
    
    .modal-close:hover {
      color: #333;
    }
    
    .modal-body {
      font-size: 14px;
      color: #333;
    }
    
    .modal-body .field {
      margin-bottom: 15px;
    }
    
    .modal-body .label {
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
    }
    
    .modal-body .value {
      color: #333;
    }
    
    .modal-body .answers {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }
    
    .modal-body .answer {
      margin-bottom: 15px;
    }
    
    .modal-body .answer-question {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }
    
    .modal-body .answer-values {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Admin Dashboard</h1>
    <div class="user-info">
      <span class="username" id="username">Loading...</span>
      <a href="/admin/settings" class="settings-link">Settings</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>
  
  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <h3>Total Bookings</h3>
        <div class="value" id="totalBookings">-</div>
        <div class="sub" id="bookingRevenue">Revenue: $0</div>
      </div>
      <div class="stat-card">
        <h3>Collaborations</h3>
        <div class="value" id="totalCollabs">-</div>
        <div class="sub">Requests received</div>
      </div>
      <div class="stat-card">
        <h3>Questionnaires</h3>
        <div class="value" id="totalQuestionnaires">-</div>
        <div class="sub">Submissions</div>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-tab="bookings">Bookings</button>
      <button class="tab" data-tab="collaborations">Collaborations</button>
      <button class="tab" data-tab="questionnaires">Questionnaires</button>
    </div>
    
    <div class="content">
      <div class="error" id="error"></div>
      
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search...">
        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button id="refreshBtn">Refresh</button>
        <button id="exportBtn">Export CSV</button>
      </div>
      
      <div id="tableContainer">
        <div class="loading">Loading...</div>
      </div>
      
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  
  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Details</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  
  <script>
    let currentTab = 'bookings';
    let currentPage = 0;
    const perPage = 20;
    
    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/stats');
        if (!response.ok) {
          window.location.href = '/admin/login';
          return false;
        }
        return true;
      } catch (err) {
        window.location.href = '/admin/login';
        return false;
      }
    }
    
    // Load stats
    async function loadStats() {
      try {
        const response = await fetch('/api/admin/stats');
        const data = await response.json();
        
        document.getElementById('totalBookings').textContent = data.bookings.total || 0;
        document.getElementById('bookingRevenue').textContent = `Revenue: $${(data.bookings.total_revenue || 0).toFixed(2)}`;
        document.getElementById('totalCollabs').textContent = data.collaborations || 0;
        document.getElementById('totalQuestionnaires').textContent = data.questionnaires || 0;
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }
    
    // Load data based on current tab
    async function loadData() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div class="loading">Loading...</div>';
      
      try {
        let endpoint = '';
        if (currentTab === 'bookings') endpoint = '/api/admin/bookings';
        else if (currentTab === 'collaborations') endpoint = '/api/admin/collaborations';
        else if (currentTab === 'questionnaires') endpoint = '/api/admin/questionnaires';
        
        const search = document.getElementById('searchInput').value;
        const status = document.getElementById('statusFilter').value;
        
        const url = `${endpoint}?limit=${perPage}&offset=${currentPage * perPage}&search=${encodeURIComponent(search)}&status=${encodeURIComponent(status)}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        renderTable(data);
      } catch (err) {
        container.innerHTML = '<div class="error show">Failed to load data</div>';
      }
    }
    
    // Render table
    function renderTable(data) {
      const container = document.getElementById('tableContainer');
      const items = data[currentTab] || [];
      
      if (items.length === 0) {
        container.innerHTML = '<div class="empty">No records found</div>';
        return;
      }
      
      let html = '<table class="table"><thead><tr>';
      
      if (currentTab === 'bookings') {
        html += '<th>Ref</th><th>Date</th><th>Time</th><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Actions</th>';
      } else if (currentTab === 'collaborations') {
        html += '<th>Ref</th><th>Name</th><th>Email</th><th>Org</th><th>Kind</th><th>Created</th><th>Actions</th>';
      } else if (currentTab === 'questionnaires') {
        html += '<th>Ref</th><th>Name</th><th>Email</th><th>Company</th><th>Role</th><th>Booked</th><th>Created</th><th>Actions</th>';
      }
      
      html += '</tr></thead><tbody>';
      
      items.forEach(item => {
        html += '<tr>';
        
        if (currentTab === 'bookings') {
          html += `<td>${item.ref}</td>`;
          html += `<td>${item.date}</td>`;
          html += `<td>${item.time}</td>`;
          html += `<td>${item.name}</td>`;
          html += `<td>${item.email}</td>`;
          html += `<td>${item.type}</td>`;
          html += `<td><span class="status ${item.status}">${item.status}</span></td>`;
          html += `<td>
            <button class="action-btn" onclick="viewBooking('${item.ref}')">View</button>
            ${item.status === 'confirmed' ? `<button class="action-btn danger" onclick="cancelBooking('${item.ref}')">Cancel</button>` : ''}
          </td>`;
        } else if (currentTab === 'collaborations') {
          html += `<td>${item.ref}</td>`;
          html += `<td>${item.name}</td>`;
          html += `<td>${item.email}</td>`;
          html += `<td>${item.org || 'N/A'}</td>`;
          html += `<td>${item.kind || 'N/A'}</td>`;
          html += `<td>${new Date(item.created_at).toLocaleDateString()}</td>`;
          html += `<td><button class="action-btn" onclick="viewCollaboration('${item.ref}')">View</button></td>`;
        } else if (currentTab === 'questionnaires') {
          html += `<td>${item.ref}</td>`;
          html += `<td>${item.first_name} ${item.last_name}</td>`;
          html += `<td>${item.email}</td>`;
          html += `<td>${item.company}</td>`;
          html += `<td>${item.role}</td>`;
          html += `<td>${item.booked ? 'Yes' : 'No'}</td>`;
          html += `<td>${new Date(item.created_at).toLocaleDateString()}</td>`;
          html += `<td><button class="action-btn" onclick="viewQuestionnaire('${item.ref}')">View</button></td>`;
        }
        
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }
    
    // View booking details
    async function viewBooking(ref) {
      try {
        const response = await fetch(`/api/admin/bookings/${ref}`);
        const data = await response.json();
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.textContent = `Booking ${data.booking.ref}`;
        
        let html = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${data.booking.name}</div>
          </div>
          <div class="field">
            <div class="label">Email</div>
            <div class="value">${data.booking.email}</div>
          </div>
          <div class="field">
            <div class="label">Organization</div>
            <div class="value">${data.booking.org || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Date & Time</div>
            <div class="value">${data.booking.date} at ${data.booking.time} (${data.booking.timezone})</div>
          </div>
          <div class="field">
            <div class="label">Session</div>
            <div class="value">${data.booking.sessionName} (${data.booking.duration} min)</div>
          </div>
          <div class="field">
            <div class="label">Price</div>
            <div class="value">$${data.booking.price} USD</div>
          </div>
          <div class="field">
            <div class="label">Status</div>
            <div class="value">${data.booking.status}</div>
          </div>
          <div class="field">
            <div class="label">Notes</div>
            <div class="value">${data.booking.notes || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Created</div>
            <div class="value">${new Date(data.booking.created_at).toLocaleString()}</div>
          </div>
        `;
        
        if (data.questionnaire) {
          html += `
            <div class="answers">
              <div class="field">
                <div class="label">Linked Questionnaire</div>
                <div class="value">${data.questionnaire.ref}</div>
              </div>
              <div class="field">
                <div class="label">Name</div>
                <div class="value">${data.questionnaire.first_name} ${data.questionnaire.last_name}</div>
              </div>
              <div class="field">
                <div class="label">Company</div>
                <div class="value">${data.questionnaire.company}</div>
              </div>
            </div>
          `;
        }
        
        modalBody.innerHTML = html;
        modal.classList.add('show');
      } catch (err) {
        alert('Failed to load booking details');
      }
    }
    
    // Cancel booking
    async function cancelBooking(ref) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;
      
      try {
        const response = await fetch(`/api/admin/bookings/${ref}/cancel`, { method: 'POST' });
        if (response.ok) {
          loadData();
          loadStats();
        } else {
          alert('Failed to cancel booking');
        }
      } catch (err) {
        alert('Failed to cancel booking');
      }
    }
    
    // View collaboration details
    async function viewCollaboration(ref) {
      try {
        const response = await fetch(`/api/admin/collaborations/${ref}`);
        const data = await response.json();
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.textContent = `Collaboration ${data.collaboration.ref}`;
        
        modalBody.innerHTML = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${data.collaboration.name}</div>
          </div>
          <div class="field">
            <div class="label">Email</div>
            <div class="value">${data.collaboration.email}</div>
          </div>
          <div class="field">
            <div class="label">Organization</div>
            <div class="value">${data.collaboration.org || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Kind</div>
            <div class="value">${data.collaboration.kind || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Link</div>
            <div class="value">${data.collaboration.link ? `<a href="${data.collaboration.link}" target="_blank">${data.collaboration.link}</a>` : 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Message</div>
            <div class="value">${data.collaboration.message || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Created</div>
            <div class="value">${new Date(data.collaboration.created_at).toLocaleString()}</div>
          </div>
        `;
        
        modal.classList.add('show');
      } catch (err) {
        alert('Failed to load collaboration details');
      }
    }
    
    // View questionnaire details
    async function viewQuestionnaire(ref) {
      try {
        const response = await fetch(`/api/admin/questionnaires/${ref}`);
        const data = await response.json();
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.textContent = `Questionnaire ${data.questionnaire.ref}`;
        
        let html = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${data.questionnaire.first_name} ${data.questionnaire.last_name}</div>
          </div>
          <div class="field">
            <div class="label">Email</div>
            <div class="value">${data.questionnaire.email}</div>
          </div>
          <div class="field">
            <div class="label">Phone</div>
            <div class="value">${data.questionnaire.phone}</div>
          </div>
          <div class="field">
            <div class="label">Company</div>
            <div class="value">${data.questionnaire.company}</div>
          </div>
          <div class="field">
            <div class="label">Role</div>
            <div class="value">${data.questionnaire.role}</div>
          </div>
          <div class="field">
            <div class="label">About</div>
            <div class="value">${data.questionnaire.about || 'N/A'}</div>
          </div>
          <div class="field">
            <div class="label">Booked</div>
            <div class="value">${data.questionnaire.booked ? `Yes (${data.questionnaire.booking_ref})` : 'No'}</div>
          </div>
          <div class="field">
            <div class="label">Created</div>
            <div class="value">${new Date(data.questionnaire.created_at).toLocaleString()}</div>
          </div>
        `;
        
        if (data.answers && data.answers.length > 0) {
          html += '<div class="answers"><h3>Answers</h3>';
          data.answers.forEach(answer => {
            html += `
              <div class="answer">
                <div class="answer-question">${answer.question_text}</div>
                <div class="answer-values">${JSON.parse(answer.answer_values).join(', ')}</div>
              </div>
            `;
          });
          html += '</div>';
        }
        
        modalBody.innerHTML = html;
        modal.classList.add('show');
      } catch (err) {
        alert('Failed to load questionnaire details');
      }
    }
    
    // Export CSV
    async function exportCSV() {
      try {
        let endpoint = '';
        let filename = '';
        
        if (currentTab === 'bookings') {
          endpoint = '/api/admin/bookings';
          filename = 'bookings.csv';
        } else if (currentTab === 'collaborations') {
          endpoint = '/api/admin/collaborations';
          filename = 'collaborations.csv';
        } else if (currentTab === 'questionnaires') {
          endpoint = '/api/admin/questionnaires';
          filename = 'questionnaires.csv';
        }
        
        const response = await fetch(endpoint);
        const data = await response.json();
        const items = data[currentTab] || [];
        
        if (items.length === 0) {
          alert('No data to export');
          return;
        }
        
        let csv = '';
        
        if (currentTab === 'bookings') {
          csv = 'Ref,Date,Time,Name,Email,Organization,Type,Duration,Price,Status,Created\n';
          items.forEach(item => {
            csv += `"${item.ref}","${item.date}","${item.time}","${item.name}","${item.email}","${item.org || ''}","${item.type}","${item.duration}","${item.price}","${item.status}","${item.created_at}"\n`;
          });
        } else if (currentTab === 'collaborations') {
          csv = 'Ref,Name,Email,Organization,Kind,Link,Created\n';
          items.forEach(item => {
            csv += `"${item.ref}","${item.name}","${item.email}","${item.org || ''}","${item.kind || ''}","${item.link || ''}","${item.created_at}"\n`;
          });
        } else if (currentTab === 'questionnaires') {
          csv = 'Ref,First Name,Last Name,Email,Phone,Company,Role,Booked,Booking Ref,Created\n';
          items.forEach(item => {
            csv += `"${item.ref}","${item.first_name}","${item.last_name}","${item.email}","${item.phone}","${item.company}","${item.role}","${item.booked}","${item.booking_ref || ''}","${item.created_at}"\n`;
          });
        }
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert('Failed to export CSV');
      }
    }
    
    // Logout
    async function logout() {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        window.location.href = '/admin/login';
      } catch (err) {
        window.location.href = '/admin/login';
      }
    }
    
    // Event listeners
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        currentPage = 0;
        loadData();
      });
    });
    
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    
    // Modal close
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('show');
    });
    
    // Close modal on outside click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        document.getElementById('modal').classList.remove('show');
      }
    });
    
    // Initialize
    checkAuth().then(authenticated => {
      if (authenticated) {
        loadStats();
        loadData();
      }
    });
  </script>
</body>
</html>
